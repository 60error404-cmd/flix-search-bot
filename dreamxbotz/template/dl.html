<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d18">
  <title>{{ bot_name }} | {{ file_name }}</title>
  <style>
    :root{color-scheme:dark;--bg:#080d18;--panel:#111b2b;--line:#263449;--text:#f4f7fb;--muted:#9aabc0;--accent:#f45b78}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 0%,#182a45 0,transparent 45%),var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}
    header{position:sticky;top:0;background:#080d18eF;border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}
    .bar,main,footer{width:min(920px,calc(100% - 32px));margin:auto}
    .bar{height:68px;display:flex;align-items:center;justify-content:space-between;gap:16px}
    a{color:inherit;text-decoration:none}
    .brand{font-weight:800;letter-spacing:.3px}
    .nav{display:flex;gap:18px;color:var(--muted);font-size:14px}
    main{padding:56px 0 72px}
    .eyebrow{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase}
    h1{font-size:clamp(24px,5vw,38px);line-height:1.2;overflow-wrap:anywhere;margin:10px 0}
    .muted{color:var(--muted)}
    .panel{margin-top:26px;padding:clamp(20px,4vw,34px);background:linear-gradient(145deg,#142137,#0e1726);border:1px solid var(--line);border-radius:20px;box-shadow:0 24px 70px #0005}
    .file-meta{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0 24px}
    .pill{border:1px solid var(--line);border-radius:999px;padding:5px 12px;color:var(--muted);font-size:13px}
    .actions{display:flex;flex-wrap:wrap;gap:12px}
    .btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;padding:12px 18px;border-radius:12px;background:#1b2a40;border:1px solid #354760;font-weight:650}
    .btn.primary{background:var(--accent);border-color:var(--accent);color:#160b12}
    .btn:hover{filter:brightness(1.1)}
    footer{border-top:1px solid var(--line);padding:22px 0 30px;text-align:center;color:var(--muted);font-size:13px}
    @media(max-width:520px){.bar{height:60px}.nav{gap:12px}main{padding:36px 0 54px}.actions{display:grid}.btn{width:100%}}
  </style>
</head>
<body>
  <header><div class="bar">
    <a class="brand" href="/">DreamXBotz</a>
    <nav class="nav"><a href="/">Home</a><a href="{{ updates_url }}" target="_blank" rel="noopener noreferrer">Updates</a></nav>
  </div></header>
  <main>
    <div class="eyebrow">File ready</div>
    <h1>{{ file_name }}</h1>
    <p class="muted">Your file is ready. Use the download button below to save it to your device.</p>
    <section class="panel">
      <div class="file-meta"><span class="pill">Size: {{ file_size }}</span><span class="pill">DreamXBotz file delivery</span></div>
      <div class="actions">
        <a class="btn primary" href="{{ file_url }}" download>↓ Download file</a>
        <a class="btn" href="{{ file_url }}" target="_blank" rel="noopener noreferrer">Open file</a>
        <a class="btn" href="/">Back to home</a>
      </div>
    </section>
  </main>
  <footer>© 2026 <a href="/">DreamXBotz</a>. Stream responsibly.</footer>
</body>
</html>
